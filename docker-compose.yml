services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: requirements
      POSTGRES_USER: requirements
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requirements -d requirements"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://requirements:${POSTGRES_PASSWORD:-local-development-only}@db:5432/requirements
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-deployment}
      CORS_ORIGINS: http://localhost:8000
    restart: unless-stopped
volumes:
  postgres_data:
