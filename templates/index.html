<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Requirements Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Financial Requirements & SDLC Analyzer</h1>
        <p>Agentic AI-assisted requirement gathering and SDLC recommendation for regulated financial systems.</p>
      </header>

      <main>
        <form method="post" action="/analyze">
          <label for="requirements">Paste stakeholder requirements, policy notes, or business documents</label>
          <textarea id="requirements" name="requirements" rows="18">{{ default_text }}</textarea>
          <div class="actions">
            <button type="submit">Analyze requirements</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
